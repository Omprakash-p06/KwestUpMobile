# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# Enable caching between builds.
org.gradle.caching=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# ✅ New Architecture is MANDATORY at React Native 0.86 — the opt-out was removed in RN 0.82.
#    Expo docs: "Starting with React Native 0.82, the option to disable the New Architecture was
#    removed, so setting newArchEnabled to false has no effect." This project builds New
#    Architecture either way, so the flag is no longer a way to avoid it.
#
# 2026-10-12 (debug session: expo57-native-compat): the flag is kept explicitly TRUE — not for
# React Native itself, which ignores it, but because third-party modules read it as a GRADLE
# PROPERTY and gate their own New Architecture codegen on it. llama.rn@0.12.x is the concrete case:
#
#   llama.rn/android/build.gradle:12   isNewArchitectureEnabled() -> rootProject.getProperty("newArchEnabled")
#   llama.rn/android/build.gradle:84   applies plugin "com.facebook.react" only when TRUE
#   llama.rn/android/build.gradle:239  runs `react { codegenJavaPackageName = "com.rnllama" }` only when TRUE
#   RNLlamaModule.java:11              declares `extends NativeRNLlamaSpec` UNCONDITIONALLY
#
# Because that class extends the generated spec unconditionally, codegen output is required to
# compile at all. With the property unset or false, llama.rn skips codegen and the Android build
# fails on a missing NativeRNLlamaSpec. Setting it true satisfies the module's own gate natively,
# which is why the patch-llama-gradle.js workaround that used to force-unwrap those two
# conditionals has been removed.
#
# Superseded (2026-06-05, debug session: newarch-startup-crash-v2): a Fabric-init startup crash on
# Nothing Phone 3a (NothingOS NtOnlineConfigImpl) was mitigated by setting this false. That
# mitigation stopped having any effect at RN 0.82 and was never protecting the RN 0.86 build — the
# device crash must be re-verified on hardware, not assumed to be handled by this flag.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Enable GIF support in React Native images (~200 B increase)
expo.gif.enabled=true
# Enable webp support in React Native images (~85 KB increase)
expo.webp.enabled=true
# Enable animated webp support (~3.4 MB increase)
# Disabled by default because iOS doesn't support animated webp
expo.webp.animated=false

# Enable network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Use legacy packaging to compress native libraries in the resulting APK.
# Set to true to support Android 16 (16 KB page size) by extracting native libs at install time.
expo.useLegacyPackaging=true

# Mandatory for Android 16.

# Whether the app is configured to use edge-to-edge via the app config or `react-native-edge-to-edge` plugin
expo.edgeToEdgeEnabled=true