name: Semgrep OSS Code Security

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Security Scan
    runs-on: ubuntu-latest
    # The maintained Semgrep CE image (pinned for reproducibility). The old
    # semgrep/semgrep-action@v1 wrapper was deprecated in April 2024 and its
    # `docker://returntocorp/semgrep-agent:v1` image is retired, which made this
    # job fail unconditionally. See:
    # https://semgrep.dev/docs/semgrep-ci/sample-ci-configs
    container:
      image: semgrep/semgrep:1.180.0
    # Skip dependabot PRs, which cannot access repository secrets.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Report-only scan. Findings are uploaded as SARIF below for visibility
      # but do not fail the build: `--config auto` uses Semgrep CE community
      # rules and needs no SEMGREP_APP_TOKEN. Promote this to a blocking gate
      # (drop `|| true`, add `--error`) once current findings are triaged —
      # see CONCERNS.md ("Enforced gates missing").
      - name: Run Semgrep Scan
        run: semgrep scan --config auto --sarif --output semgrep.sarif . || true

      - name: Upload SARIF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
