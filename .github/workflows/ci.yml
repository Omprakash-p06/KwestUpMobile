name: CI Pipeline (Lint & Test)

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Code Quality & Test Automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Blocking gate: ESLint errors fail the build. Pre-existing warnings
      # (~483 at last triage) are tolerated; see CONCERNS.md for the phased
      # plan to escalate warnings once they are triaged.
      - name: Run ESLint Check
        run: npm run lint

      # Always produce a machine-readable report for the artifact below, even
      # when the gate above fails. `|| true` is scoped to report generation so
      # it cannot mask the actual lint result.
      - name: Generate ESLint Report
        if: always()
        run: npm run lint:report || true

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Run Jest Test Suite
        run: npx jest --ci --maxWorkers=2 --coverage

      - name: Upload ESLint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: ignore

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
